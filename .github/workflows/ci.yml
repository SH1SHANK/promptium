# File: .github/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-format:
    name: Lint & Format (Fast Feedback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Run Prettier Check
        run: pnpm prettier:check

      - name: Run ESLint Check
        run: pnpm lint

  typecheck:
    name: TypeScript Check (Fast Feedback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Run Type Check
        run: pnpm typecheck

  test:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Project
        uses: ./.github/actions/setup-project

      - name: Run Knip Verification
        run: pnpm knip --exclude exports,types,nsExports,nsTypes,classMembers,enumMembers,duplicates,unlisted,binaries

      - name: Run Adapter Tests
        run: pnpm test:adapters

      - name: Run Context Menu Tests
        run: pnpm test:context-menu

      - name: Run Importer Tests
        run: pnpm test:importer

      - name: Run CRE Tests
        run: pnpm test:cre

      - name: Run Retrieval Tests
        run: pnpm test:retrieval

      - name: Run Clippings Tests
        run: pnpm test:clippings

  build:
    name: Compile & Validate Production Bundle
    runs-on: ubuntu-latest
    needs: [lint-format, typecheck]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Project
        uses: ./.github/actions/setup-project

      # Run build, check build reproducibility, zip, and validate artifact structure
      - name: Run Build and Verification Checks
        run: pnpm verify:build

      # Upload Build Artifacts for release verification (7 days retention)
      - name: Upload Production Extension Bundle
        uses: actions/upload-artifact@4bec3efae2027e8a97d2d85d7b913e00e2a720e5 # v4.6.0
        with:
          name: promptium-chrome-extension
          path: .output/chrome-mv3
          retention-days: 7

      - name: Upload Packaged Zip Archive
        uses: actions/upload-artifact@4bec3efae2027e8a97d2d85d7b913e00e2a720e5 # v4.6.0
        with:
          name: promptium-packaged-zip
          path: .output/*.zip
          retention-days: 7

      # Upload Bundle Analysis Report (30 days retention)
      - name: Upload Bundle Analysis Report
        uses: actions/upload-artifact@4bec3efae2027e8a97d2d85d7b913e00e2a720e5 # v4.6.0
        with:
          name: bundle-analysis-report
          path: .output/bundle-analysis.html
          retention-days: 30

      # Capture and upload failure diagnostics if the build/tests fail
      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@4bec3efae2027e8a97d2d85d7b913e00e2a720e5 # v4.6.0
        with:
          name: failure-diagnostics
          path: |
            .output/
            *.log
          retention-days: 7

      # Generate step summaries
      - name: Generate GHA Summary Reports
        shell: bash
        run: |
          echo "### Promptium Build Verification Dashboard 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📋 Build Metadata" >> $GITHUB_STEP_SUMMARY
          if [ -f .output/chrome-mv3/metadata.json ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat .output/chrome-mv3/metadata.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Metadata file not found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📦 Bundle Size Verification" >> $GITHUB_STEP_SUMMARY
          if [ -f .output/bundle-summary.txt ]; then
            cat .output/bundle-summary.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Bundle size report not found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔏 Dependency License Report" >> $GITHUB_STEP_SUMMARY
          if [ -f .output/license-report.md ]; then
            cat .output/license-report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "License report not found." >> $GITHUB_STEP_SUMMARY
          fi
