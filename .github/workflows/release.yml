# File: .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Project
        uses: ./.github/actions/setup-project

      # Run build, check build reproducibility, zip, and validate artifact structure
      - name: Run Build and Verification Checks
        run: pnpm verify:build

      # Prepare release asset with a clean filename and checksum signature
      - name: Prepare Release Asset
        shell: bash
        run: |
          cp .output/promptium-*-chrome.zip .output/promptium.zip
          cp .output/promptium-*-chrome.zip.sha256 .output/promptium.zip.sha256

      # Publish release assets (permanent on GitHub releases)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe14b83961b2c61c16a094e9f3b97b0a70191 # v2.2.0
        with:
          files: |
            .output/promptium.zip
            .output/promptium.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
