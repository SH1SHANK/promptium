<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promptium</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/promptium/icon32.png" />
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="onboarding.css" />
  </head>
  <body class="pn-popup">
    <header class="pn-header">
      <h1 class="pn-title pn-header-title">Promptium</h1>
      <div class="pn-header-actions">
        <div id="ai-status" class="pn-ai-status pn-ai-status--loading">
          <span class="pn-ai-dot loading"></span>
          <span class="pn-ai-status__text">Loading AI...</span>
        </div>
        <button id="add-prompt-btn" class="pn-btn pn-btn--primary" type="button">Add Prompt</button>
      </div>
    </header>

    <div class="pn-search-row">
      <div class="pn-search-input-wrap">
        <input id="prompt-search" class="pn-search" type="text" placeholder="Search prompts by title or tags" />
        <button id="pn-search-clear" type="button" class="pn-search-clear pn-hidden" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <nav class="pn-tab-bar" aria-label="Promptium tabs">
      <button class="tab pn-tab active" data-tab="prompts" type="button">Prompts</button>
      <button class="tab pn-tab" data-tab="history" type="button">History</button>
    </nav>

    <main class="pn-main">
      <section class="tab-content pn-tab-content active" data-tab="prompts">
        <div id="pn-popup-template-fill-panel" class="pn-template-fill-panel pn-hidden"></div>
        <div id="prompt-list" class="pn-list"></div>
      </section>

      <section class="tab-content pn-tab-content" data-tab="history">
        <div id="history-list" class="pn-list"></div>
      </section>
    </main>

    <div id="add-modal" class="pn-modal pn-hidden">
      <div class="pn-modal__backdrop" data-close-modal></div>
      <div class="pn-modal__panel">
        <h2 class="pn-modal__title">Save Prompt</h2>

        <div id="pn-add-mode-selector" class="pn-add-mode-selector">
          <p class="pn-mode-question">What kind of prompt do you want to save?</p>
          <button class="pn-mode-card" id="pn-mode-plain" type="button">
            <span class="pn-mode-icon">✏️</span>
            <span class="pn-mode-text">
              <span class="pn-mode-title">Plain Prompt</span>
              <span class="pn-mode-desc">Use this when you always run the same prompt text.</span>
            </span>
          </button>
          <button class="pn-mode-card" id="pn-mode-template" type="button">
            <span class="pn-mode-icon">🧩</span>
            <span class="pn-mode-text">
              <span class="pn-mode-title">Fill-in Template</span>
              <span class="pn-mode-desc">Use [blanks] you can fill before injecting.</span>
            </span>
          </button>
          <button class="pn-mode-cancel" id="pn-mode-cancel" type="button">Cancel</button>
        </div>

        <div id="pn-add-plain-form" class="pn-add-form pn-hidden">
          <div class="pn-form-header">
            <button class="pn-back-btn" id="pn-plain-back" type="button">← Back</button>
            <span class="pn-form-title">New Prompt</span>
          </div>

          <label class="pn-field">
            <span>Title</span>
            <input id="prompt-title" type="text" placeholder="Prompt title" maxlength="80" />
          </label>

          <label class="pn-field">
            <span>Prompt Text</span>
            <textarea id="prompt-text" rows="6" placeholder="Write your prompt here..."></textarea>
          </label>

          <label class="pn-field">
            <span>Tags</span>
            <div class="pn-tag-badges" id="tag-badges-wrap">
              <input id="prompt-tags-input" class="pn-tag-badges__input" type="text" placeholder="Type a tag and press Space" />
            </div>
            <input id="prompt-tags" type="hidden" />
          </label>

          <div class="pn-modal__actions">
            <button id="cancel-modal" class="pn-btn pn-btn--ghost" type="button">Cancel</button>
            <button id="confirm-duplicate" class="pn-btn pn-btn-warn hidden" type="button">Save Anyway</button>
            <button id="save-new-prompt" class="pn-btn pn-btn--primary" type="button">Save Prompt</button>
          </div>
        </div>

        <div id="pn-add-template-form" class="pn-add-form pn-hidden">
          <div class="pn-form-header">
            <button class="pn-back-btn" id="pn-template-back" type="button">← Back</button>
            <span class="pn-form-title">New Template</span>
          </div>

          <label class="pn-field">
            <span>Title</span>
            <input id="pn-template-title" type="text" placeholder="Template name" maxlength="80" />
          </label>

          <p class="pn-template-hint">
            Use <strong>[brackets]</strong> for blanks, like <em>[topic]</em>. Add <strong>?</strong> for optional blanks, like <em>[tone?]</em>.
          </p>

          <label class="pn-field">
            <span>Template Text</span>
            <div class="pn-textarea-wrap">
              <textarea id="pn-template-text" class="pn-form-textarea" rows="6" placeholder="Write your template here..."></textarea>
              <div class="pn-var-toolbar" id="pn-var-toolbar">
                <span class="pn-var-toolbar-label">Add a blank:</span>
                <button class="pn-var-btn" data-snippet="[label]" type="button">[blank]</button>
                <button class="pn-var-btn" data-snippet="[label?]" type="button">[optional?]</button>
                <span class="pn-var-toolbar-divider"></span>
                <span class="pn-var-toolbar-tip">Inserts at cursor</span>
              </div>
            </div>
          </label>

          <div class="pn-detected-vars" id="pn-detected-vars" aria-live="polite"></div>

          <label class="pn-field">
            <span>Tags</span>
            <input id="pn-template-tags" type="text" placeholder="Comma separated (optional)" />
          </label>

          <div class="pn-modal__actions">
            <button id="pn-template-cancel" class="pn-btn pn-btn--ghost" type="button">Cancel</button>
            <button id="pn-template-save" class="pn-btn pn-btn--primary" type="button">Save Template</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../libs/jspdf.min.js"></script>
    <script src="../utils/constants.js"></script>
    <script src="../utils/dom-helpers.js"></script>
    <script src="../utils/tags.js"></script>
    <script src="../utils/platform.js"></script>
    <script src="../utils/storage.js"></script>
    <script src="../utils/template-parser.js"></script>
    <script src="../utils/smart-name.js"></script>
    <script src="../utils/exporter.js"></script>
    <script src="../utils/ai.js"></script>
    <script src="../utils/templates.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
