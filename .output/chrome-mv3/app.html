<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptium</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/promptium/icon32.png">
    <script type="module" crossorigin src="/chunks/app-Bb9Pcle0.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app-BfokCCBM.css">
  </head>
  <body class="pn-popup pn-sidepanel pn-app-window">
    <header class="pn-header pn-sidepanel-header">
      <div class="pn-header-actions">
        <span id="pn-search-setup-indicator" class="pn-search-setup-indicator pn-hidden" title="Setting up search..." aria-label="Setting up search"></span>
        <button id="back-btn" class="hidden pn-btn pn-btn--ghost pn-icon-btn pn-mr-auto" type="button" title="Back" aria-label="Back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
          <span>Back</span>
        </button>
        <span id="header-page-title" class="hidden"></span>

        <button id="refresh-btn" class="pn-btn pn-btn--ghost pn-icon-btn" type="button" title="Refresh Workspace" aria-label="Refresh Workspace">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
        </button>
        <button id="add-prompt-btn" class="pn-btn pn-btn--primary" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Add Prompt
        </button>
        <button id="panel-close-btn" class="pn-btn pn-btn--ghost pn-icon-btn hidden" type="button" title="Close" aria-label="Close">
          ×
        </button>
      </div>
    </header>

    <div id="search-wrap" class="pn-search-row">
      <div class="pn-search-input-wrap">
        <input id="prompt-search" class="pn-search" type="text" placeholder="Search title, prompt text, tags, or category">
        <button id="pn-search-clear" type="button" class="pn-search-clear pn-hidden" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <span id="pn-search-mode-badge" class="pn-search-mode-badge pn-hidden">Keyword search</span>
      <span id="pn-search-spark" class="pn-search-spark pn-hidden">✦</span>
      <div id="pn-model-feedback" class="pn-model-feedback pn-hidden" aria-live="polite">
        <span id="pn-model-feedback-dot" class="pn-model-feedback__dot"></span>
        <span id="pn-model-feedback-text">Checking Gemini state…</span>
      </div>
      <div id="pn-ai-bar" class="pn-ai-bar pn-ai-bar--hidden">
        <div class="pn-ai-bar__line"></div>
      </div>
    </div>
    <nav class="pn-tab-bar" aria-label="Promptium tabs">
      <button class="tab pn-tab active" data-tab="prompts" type="button">Prompt Library</button>
      <button id="pn-nav-new-prompt" class="tab pn-tab" type="button">New Prompt</button>
    </nav>

    <main class="pn-main pn-sidepanel-main">
      <section class="tab-content pn-tab-content active" data-tab="prompts">
        <div id="pn-search-assists" class="pn-search-assists pn-hidden">
          <div id="pn-recent-searches" class="pn-search-chip-row"></div>
          <div id="pn-category-filters" class="pn-search-chip-row"></div>
        </div>
        <div id="pn-template-filters" class="pn-template-filters pn-hidden" role="tablist" aria-label="Filter templates by category">
          <button class="pn-filter-chip active" data-filter="all" role="tab" aria-selected="true" type="button">
            All
          </button>
          <button class="pn-filter-chip" data-filter="writing" role="tab" aria-selected="false" type="button">
            Writing
          </button>
          <button class="pn-filter-chip" data-filter="coding" role="tab" aria-selected="false" type="button">
            Coding
          </button>
          <button class="pn-filter-chip" data-filter="study" role="tab" aria-selected="false" type="button">
            Study
          </button>
          <button class="pn-filter-chip" data-filter="research" role="tab" aria-selected="false" type="button">
            Research
          </button>
          <button class="pn-filter-chip" data-filter="creative" role="tab" aria-selected="false" type="button">
            Creative
          </button>
          <button class="pn-filter-chip" data-filter="work" role="tab" aria-selected="false" type="button">
            Work
          </button>
          <button class="pn-filter-chip" data-filter="general" role="tab" aria-selected="false" type="button">
            General
          </button>
        </div>
        <div id="pn-template-fill-panel" class="pn-template-fill-panel pn-hidden"></div>
        <div id="prompt-list" class="pn-list"></div>
      </section>

      <!-- Add/Edit Vault Item Modal Dialog -->

      <!-- Universal AI Context Importer Preview Modal -->

      <!-- Review Mode Modal Overlay -->
    </main>

    <div id="pn-command-palette" class="pn-command-palette pn-hidden" role="dialog" aria-modal="true" aria-labelledby="pn-command-palette-title">
      <div class="pn-command-palette__backdrop" data-command-close=""></div>
      <div class="pn-command-palette__panel">
        <h2 id="pn-command-palette-title" class="pn-command-palette__title">Command Palette</h2>
        <input id="pn-command-input" class="pn-command-input" type="text" placeholder="Search commands or prompts" autocomplete="off">
        <div id="pn-command-results" class="pn-command-results"></div>
      </div>
    </div>

    <div id="add-modal" class="pn-modal pn-hidden" role="dialog" aria-modal="true" aria-labelledby="pn-add-modal-title" aria-describedby="pn-add-modal-desc">
      <div class="pn-modal__backdrop" data-close-modal=""></div>
      <div class="pn-modal__panel pn-builder-panel">
        <!-- Toolbar -->
        <header class="pn-builder-toolbar">
          <div class="pn-builder-toolbar-left">
            <button id="pn-builder-close" class="pn-builder-close-btn" type="button" title="Close Workspace">
              ×
            </button>
            <span id="pn-builder-autosave-status" class="pn-autosave-status">
              <span class="pn-status-dot pn-status-dot--saved"></span>
              <span class="pn-status-text">Saved</span>
            </span>
          </div>
          <div class="pn-builder-toolbar-right">
            <button id="pn-builder-save" class="pn-btn pn-btn--primary pn-toolbar-action-btn" type="button">
              Save
            </button>
            <div class="pn-builder-more-container">
              <button id="pn-builder-more-btn" class="pn-btn pn-btn--ghost pn-icon-btn pn-toolbar-action-btn" type="button" title="More options">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="1" />
                  <circle cx="12" cy="5" r="1" />
                  <circle cx="12" cy="19" r="1" />
                </svg>
              </button>
              <div id="pn-builder-more-menu" class="pn-builder-more-menu pn-hidden">
                <div class="pn-menu-section-header">Prompt Type</div>
                <div class="pn-builder-mode-selector">
                  <button id="pn-builder-mode-plain" class="pn-mode-btn active" type="button">
                    Plain
                  </button>
                  <button id="pn-builder-mode-template" class="pn-mode-btn" type="button">
                    Template
                  </button>
                </div>
                <hr class="pn-menu-divider">
                <label class="pn-menu-checkbox-item">
                  <input type="checkbox" id="prompt-favorite">
                  <span>Favorite</span>
                </label>
                <label class="pn-menu-checkbox-item">
                  <input type="checkbox" id="prompt-pinned">
                  <span>Pin to Top</span>
                </label>
                <hr class="pn-menu-divider">
                <button id="pn-builder-standalone-btn" class="pn-menu-action-btn" type="button">
                  Open Standalone
                </button>
                <button id="pn-builder-more-delete-btn" class="pn-menu-action-btn pn-menu-action-btn--danger" type="button">
                  Delete Prompt
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- Duplicate warning banner -->
        <div id="pn-builder-duplicate-banner" class="pn-hidden" style="
            background: rgba(245, 158, 11, 0.12);
            border-bottom: 1px solid rgba(245, 158, 11, 0.25);
            padding: var(--space-2.5) var(--space-4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-3);
            font-size: var(--font-size-sm);
            color: var(--color-text-primary);
          "></div>

        <!-- Main Workspace -->
        <main class="pn-builder-container">
          <!-- Inline Metadata -->
          <div class="pn-inline-metadata">
            <div style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-2);
                width: 100%;
              ">
              <input id="prompt-title" class="pn-inline-title-input" type="text" placeholder="Title" maxlength="80" autocomplete="off">
              <button id="pn-suggest-title-btn" class="pn-btn pn-btn--ghost pn-hidden" type="button" style="
                  padding: 2px 8px;
                  font-size: var(--font-size-xs);
                  height: 24px;
                  min-height: 24px;
                  white-space: nowrap;
                  border: 1px solid var(--color-border-default);
                " title="Suggest Title based on content">
                Suggest Title
              </button>
            </div>
            <input id="prompt-description" class="pn-inline-description-input" type="text" placeholder="Add description..." autocomplete="off">

            <div class="pn-inline-category-row">
              <span class="pn-inline-label">Category</span>
              <div class="pn-category-inline-select">
                <select id="prompt-category" class="pn-inline-category-select">
                  <option value="general">General</option>
                  <option value="writing">Writing</option>
                  <option value="coding">Coding</option>
                  <option value="study">Study</option>
                  <option value="research">Research</option>
                  <option value="creative">Creative</option>
                  <option value="work">Work</option>
                </select>
                <button id="pn-category-manage-btn" class="pn-btn-manage-cat-inline" type="button">
                  Manage
                </button>
              </div>
            </div>

            <!-- Inline category management panel -->
            <div id="pn-inline-categories-pane" class="pn-inline-categories-pane pn-hidden">
              <div class="pn-category-manage-row">
                <input id="pn-new-category-input" class="pn-dialog__input" type="text" placeholder="New Category Name" style="margin-bottom: 0">
                <button id="pn-add-category-btn" class="pn-btn pn-btn--primary" type="button" style="padding: 6px 12px; height: 32px">
                  Add
                </button>
              </div>
              <div id="pn-manage-categories-list" style="margin-top: var(--space-2)"></div>
            </div>

            <div class="pn-inline-tags-row">
              <div class="pn-inline-tags-wrap">
                <span class="pn-inline-label">Tags</span>
                <div class="pn-tag-badges" id="builder-tag-badges-wrap" style="flex: 1">
                  <input id="prompt-tags-input" class="pn-tag-badges__input" type="text" placeholder="Add tag..." autocomplete="off">
                </div>
                <input id="prompt-tags" type="hidden">
              </div>
            </div>
          </div>

          <hr class="pn-inline-divider">

          <!-- Editor highlighting and writing area -->
          <div class="pn-builder-editor-pane">
            <div class="pn-editor-highlight-wrap">
              <div id="pn-editor-backdrop" class="pn-editor-backdrop"></div>
              <textarea id="prompt-text" class="pn-builder-textarea" placeholder="Type your prompt here... Use {{variable_name}} to define blanks..."></textarea>
            </div>
          </div>

          <!-- Bottom Collapsible Tabs container -->
          <div class="pn-builder-tabs-container pn-collapsed">
            <div class="pn-builder-tabs-header-bar">
              <div class="pn-builder-tabs-header">
                <button class="pn-builder-tab active" data-builder-tab="preview" type="button">
                  Preview
                </button>
                <button class="pn-builder-tab" data-builder-tab="variables" type="button">
                  Variables
                </button>
                <button id="pn-builder-tab-diagnostics" class="pn-builder-tab" data-builder-tab="diagnostics" type="button">
                  Diagnostics (0)
                </button>
                <button class="pn-builder-tab" data-builder-tab="versions" type="button">
                  Save History
                </button>
              </div>
              <div id="pn-editor-stat-info" class="pn-editor-stats-bar" style="display: flex; align-items: center; gap: var(--space-3)">
                <span class="pn-stats-text">0 words • ~0 tokens • 0 variables</span>
                <span id="pn-builder-health-score" class="pn-health-score-pill" style="
                    font-weight: 600;
                    padding: 2px 6px;
                    border-radius: var(--radius-xs);
                    background: rgba(16, 185, 129, 0.15);
                    color: var(--color-success-soft);
                  ">Health: 100/100</span>
              </div>
            </div>

            <div class="pn-builder-tab-panes">
              <!-- Variables pane -->
              <div class="pn-builder-tab-pane" data-builder-pane="variables">
                <div id="pn-builder-vars-container" class="pn-vars-container"></div>
              </div>

              <!-- Diagnostics pane -->
              <div class="pn-builder-tab-pane" data-builder-pane="diagnostics">
                <div id="pn-builder-diagnostics-container" class="pn-diagnostics-container" style="display: flex; flex-direction: column; gap: var(--space-2)"></div>
              </div>

              <!-- Preview pane -->
              <div class="pn-builder-tab-pane active" data-builder-pane="preview">
                <div class="pn-preview-subtabs-row">
                  <button class="pn-subtab active" data-subtab="rendered" type="button">
                    Compiled Preview
                  </button>
                  <button class="pn-subtab" data-subtab="raw" type="button">Raw Preview</button>
                </div>
                <div id="pn-builder-preview-box" class="pn-preview-box"></div>
                <div id="pn-builder-raw-box" class="pn-preview-box pn-hidden" style="white-space: pre-wrap; font-family: var(--font-mono)"></div>
              </div>

              <!-- Versions pane -->
              <div class="pn-builder-tab-pane" data-builder-pane="versions">
                <div id="pn-builder-versions-list"></div>
                <div id="pn-builder-diff-container" class="pn-hidden">
                  <div style="
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      margin-bottom: 8px;
                    ">
                    <span style="font-weight: 600; font-size: var(--font-size-sm)">Version Comparison</span>
                    <button id="pn-close-diff-btn" class="pn-btn pn-btn--ghost" type="button" style="padding: 2px 8px; font-size: 11px">
                      Back
                    </button>
                  </div>
                  <div id="pn-diff-box" class="pn-diff-box" style="
                      white-space: pre-wrap;
                      font-family: var(--font-mono);
                      background: #111;
                      padding: 8px;
                      border-radius: 4px;
                      max-height: 220px;
                      overflow-y: auto;
                    "></div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>

      <!-- Unsaved Changes dialog (rendered locally within add-modal context for easy overlays) -->
      <div id="pn-unsaved-dialog" class="pn-dialog-overlay pn-hidden">
        <div class="pn-dialog">
          <h3 class="pn-dialog__title">Unsaved Changes</h3>
          <p class="pn-dialog__message">
            You have unsaved changes. Do you want to save them before leaving?
          </p>
          <div class="pn-dialog__actions">
            <button id="pn-unsaved-save" class="pn-dialog__btn pn-btn--primary" type="button">
              Save
            </button>
            <button id="pn-unsaved-discard" class="pn-dialog__btn pn-btn--warn-ghost" type="button">
              Discard
            </button>
            <button id="pn-unsaved-continue" class="pn-dialog__btn pn-btn--ghost" type="button">
              Keep Editing
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Improve Prompt Diff Modal -->

  </body>
</html>
